[package]
name = "snapcart"
version = "0.1.0"
description = "snapCart — frontend web empaquetado con Tauri"
edition = "2021"

[lib]
# Nombre distinto del binario para evitar conflictos en Windows (y requerido para móvil).
name = "snapcart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
